<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحديث المخزون</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --navy:#242E64; --orange:#FA9223;
  --bg:#EDEFF6; --surface:#FFFFFF; --surface-2:#F6F7FB;
  --ink:#171B33; --muted:#6A7089; --line:#D8DCEA;
  --shadow:0 1px 2px rgba(23,27,51,.06), 0 8px 24px rgba(23,27,51,.07);
  --radius:14px;
  --ar:"Tajawal","SF Arabic","Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  --num:"Poppins",ui-monospace,SFMono-Regular,Menlo,Consolas,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --navy:#1A2150; --orange:#FFA33F;
    --bg:#0E1122; --surface:#191E38; --surface-2:#141930;
    --ink:#EDEFF8; --muted:#98A0BE; --line:#2A3159;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--ar); font-size:15px; line-height:1.55;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%;
}
img{max-width:100%}
[hidden]{display:none!important}

.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--navy); color:#fff; box-shadow:0 6px 20px rgba(23,27,51,.18)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:12px;padding-inline:16px;
  display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:12px}
.titles{display:flex;flex-direction:column;gap:3px;min-width:0}
.org{color:rgba(255,255,255,.72);font-size:12.5px;font-weight:500}
.logo{height:64px;width:auto;margin-inline-start:auto;flex:0 0 auto}
.mark{font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.mark .date{font-family:var(--num);font-weight:600;font-size:13px;color:var(--orange);direction:ltr}
.mark .dash{width:22px;height:3px;background:var(--orange);border-radius:2px}
.sub{color:rgba(255,255,255,.55);font-size:12px}
.searchwrap{position:relative;display:flex;align-items:center}
.searchwrap svg{position:absolute;inset-inline-start:14px;width:18px;height:18px;opacity:.55;pointer-events:none}
#q{width:100%;padding:13px 44px;border:1.5px solid rgba(255,255,255,.18);border-radius:11px;
  background:rgba(255,255,255,.10);color:#fff;font-family:var(--num);font-size:16px;font-weight:600;
  letter-spacing:.02em;outline:none}
#q::placeholder{color:rgba(255,255,255,.55);font-family:var(--ar);font-weight:400;letter-spacing:0}
#q:focus{border-color:var(--orange);background:rgba(255,255,255,.16)}
#clear{position:absolute;inset-inline-end:8px;border:0;background:rgba(255,255,255,.14);color:#fff;
  width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
#clear:hover{background:rgba(255,255,255,.26)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.86);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;
  font-family:var(--num);font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#231400}
.chip .n{opacity:.6;font-size:11px;margin-inline-start:4px}
.mats .chip{font-family:var(--ar);font-weight:500}
.mats .chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--navy);font-weight:700}
.chip[disabled]{opacity:.35;cursor:default}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
.count{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.count b{color:var(--ink);font-family:var(--num)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;text-align:start;padding:0;font:inherit;color:inherit;
  display:flex;flex-direction:column;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--orange);outline:none}
.card{position:relative}
.card img{display:block;width:100%;aspect-ratio:66/100;object-fit:cover;background:var(--surface-2)}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;aspect-ratio:66/100;
  background:linear-gradient(160deg,#2A3375,#1A2150);color:#fff;text-align:center;padding:12px}
.ph img{width:46%;height:auto;aspect-ratio:auto;background:none;opacity:.9}
.ph span{font-size:13.5px;font-weight:700;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.4);border-radius:999px;padding:4px 12px}
.lb-img .ph{aspect-ratio:auto;height:100%;min-height:300px}
.lb-img .ph img{width:40%;max-height:none}
.pendbtn{border:1px dashed var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer;margin-inline-start:8px}
.pendbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.low{position:absolute;top:8px;inset-inline-start:8px;background:#D7263D;color:#fff;font-size:11.5px;font-weight:700;
  padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.qty.is-low{border-color:#D7263D;color:#D7263D}
.lowtag{display:inline-block;background:#D7263D;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-inline-start:8px;vertical-align:middle}
.meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px}
.code{font-family:var(--num);font-weight:600;font-size:12.5px;color:var(--ink);
  direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.metarow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{background:var(--orange);color:#231400;font-family:var(--num);font-weight:700;font-size:11.5px;
  padding:2px 7px;border-radius:6px}
.qty{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  font-size:11.5px;padding:2px 7px;border-radius:6px;white-space:nowrap}
.qty b{font-family:var(--num);font-weight:700}
.model{color:var(--muted);font-size:12px;line-height:1.35;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
  padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.lb{position:fixed;inset:0;z-index:60;background:rgba(8,10,22,.85);
  display:flex;align-items:center;justify-content:center;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lb[hidden]{display:none!important}
.lb-box{background:var(--surface);border-radius:16px;overflow:hidden;width:min(920px,100%);
  max-height:100%;display:flex;flex-direction:row-reverse;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb-img{flex:1 1 52%;background:var(--navy);display:flex;align-items:center;justify-content:center;min-width:0}
.lb-img{position:relative}
.lb-img img{width:100%;height:100%;max-height:78vh;object-fit:contain;display:block}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;border:0;
  background:rgba(255,255,255,.88);color:#171B33;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.gnav.prev{inset-inline-start:10px}.gnav.next{inset-inline-end:10px}
.gcount{position:absolute;bottom:10px;inset-inline-start:50%;transform:translateX(50%);background:rgba(8,10,22,.7);color:#fff;
  font-family:var(--num);font-size:12px;padding:3px 10px;border-radius:999px}
.pics{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:11.5px;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lb-side{flex:1 1 48%;padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.lb-head{display:flex;align-items:flex-start;gap:10px}
.lb-title{font-size:12.5px;color:var(--muted);margin:0 0 2px}
.lb-code{font-family:var(--num);font-weight:700;font-size:20px;direction:ltr;text-align:left;word-break:break-all}
.x{margin-inline-start:auto;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:20px;line-height:1;flex:0 0 auto}
.x:hover{border-color:var(--orange)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:baseline;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}
.kv .n{font-family:var(--num)}
.bigbadge{background:var(--orange);color:#231400;font-family:var(--num);font-weight:700;
  font-size:15px;padding:3px 10px;border-radius:8px;display:inline-block}
.bigqty{font-family:var(--num);font-weight:700;font-size:17px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;
  padding:9px 13px;cursor:pointer;font-family:inherit;font-size:13.5px}
.btn:hover{border-color:var(--orange)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#231400;font-weight:700}
.btn[disabled]{opacity:.4;cursor:default}
.btn.wa{background:#25D366;border-color:#25D366;color:#06301A;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.wa svg{width:17px;height:17px}
.wh{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wh span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.wh b{font-family:var(--num);color:var(--ink);font-weight:700;margin-inline-start:4px}
/* ---------- السلة ---------- */
.addrow{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px}
.addrow label{font-size:13px;color:var(--muted);white-space:nowrap}
.addrow input{width:84px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);
  font-family:var(--num);font-size:16px;font-weight:700;text-align:center}
.addrow input:focus{outline:none;border-color:var(--orange)}
.addrow .btn{margin-inline-start:auto;white-space:nowrap}
.addrow .incart{font-size:12px;color:#1E8E4E;font-weight:700}
.cartfab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--orange);color:#231400;border:0;border-radius:999px;padding:12px 18px;font-family:var(--ar);font-size:15px;font-weight:800;
  box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;gap:8px}
.cartfab .cnt{background:#231400;color:#fff;font-family:var(--num);font-size:12px;min-width:22px;height:22px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.cart{position:fixed;inset:0;z-index:70;background:rgba(8,10,22,.85);display:flex;align-items:flex-end;justify-content:center}
.cart[hidden]{display:none!important}
.cart-box{background:var(--surface);width:min(640px,100%);max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.cart-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.cart-head h2{margin:0;font-size:17px}
.cart-head .tot{color:var(--muted);font-size:13px}
.cart-list{overflow-y:auto;padding:8px 16px;flex:1 1 auto}
.ci{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci img{width:54px;height:72px;object-fit:cover;border-radius:8px;background:var(--surface-2)}
.ci .c{font-family:var(--num);font-weight:700;font-size:13.5px;direction:ltr;text-align:left}
.ci .d{color:var(--muted);font-size:12px}
.ci .d.warn{color:#D7263D;font-weight:700}
.ci .ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ci input{width:70px;padding:6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
  font-family:var(--num);font-size:15px;font-weight:700;text-align:center}
.ci .rm{border:0;background:none;color:#D7263D;font-size:12.5px;cursor:pointer;padding:2px}
.cart-empty{text-align:center;color:var(--muted);padding:40px 10px}
.cart-foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cart-foot input,.cart-foot textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);
  color:var(--ink);font-family:var(--ar);font-size:15px}
.cart-foot textarea{min-height:44px;resize:vertical}
.cart-foot .row{display:flex;gap:8px;flex-wrap:wrap}
.cart-foot .btn.wa{flex:1 1 auto;justify-content:center;font-size:15px;padding:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#171B33;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:14px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (max-width:640px){
  .lb{padding:10px}
  .lb-box{flex-direction:column;overflow-y:auto}
  .lb-img img{max-height:46vh}
  .lb-side{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brandrow">
      <div class="titles">
        <span class="org">شركة اكاف العربية - إدارة سلسلة الامداد</span>
        <span class="mark"><span class="dash"></span>تحديث المخزون <span class="date">1-10-2026</span></span>
        <span class="sub" id="total"></span>
      </div>
      <img class="logo" src="logo.png" alt="إكاف IKAF" width="203" height="160">
    </div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="اكتب الكود أو جزء منه…" aria-label="بحث بالكود">
      <button id="clear" type="button" title="مسح" aria-label="مسح البحث" hidden>×</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="chips mats" id="mats" hidden></div>
  </div>
</div>

<div class="wrap">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <b>مفيش كود مطابق</b>
    جرّب تكتب جزء من الكود بس، أو دوّر بالريشيو (B24) أو باسم الموديل (نصف كم عادى).
  </div>

<script>

  function norm(s){ return s.replace(/[٠-٩۰-۹]/g,function(d){return AR[d];})

    var c={};

    lb.hidden=true;
    document.body.style.overflow='';
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function step(n){ var j=idx+n; if(j<0||j>=shown.length) return; idx=j; fill(); }
  var gi=0;
  function showPic(){
    var it=shown[idx]; if(!it) return;
    var a=pics(it), im=lb.querySelector('.lb-img > img'), ph=lb.querySelector('.lb-img .ph');
    im.hidden=!a.length; ph.hidden=!!a.length;
    if(a.length){ im.src=a[gi]; im.alt='صنف كود '+it.c+' — صورة '+(gi+1); }
    var multi=a.length>1;
    lb.querySelector('.gnav.prev').hidden = !multi || gi<=0;
    lb.querySelector('.gnav.next').hidden = !multi || gi>=a.length-1;
    var c=lb.querySelector('.gcount'); c.hidden=!multi; c.textContent=(gi+1)+' / '+a.length;
  }
  function gstep(n){ var a=pics(shown[idx]); var j=gi+n; if(j<0||j>=a.length) return; gi=j; showPic(); }

  function buildLb(){
    lb=document.createElement('div'); lb.className='lb'; lb.hidden=true;
    lb.innerHTML='<div class="lb-box" role="dialog" aria-modal="true" aria-label="تفاصيل الصنف">'+
      '<div class="lb-img"><img alt="">'+PH+
      '<button class="gnav prev" type="button" data-a="gprev" aria-label="الصورة السابقة">&#8250;</button>'+
      '<button class="gnav next" type="button" data-a="gnext" aria-label="الصورة التالية">&#8249;</button>'+
      '<span class="gcount" dir="ltr"></span></div><div class="lb-side">'+
      '<div class="lb-head"><div><p class="lb-title">كود الصنف</p><div class="lb-code"></div></div>'+
      '<button class="x" type="button" data-a="close" aria-label="إغلاق">×</button></div>'+
      '<dl class="kv">'+
      '<dt>الريشيو</dt><dd><span class="bigbadge"></span></dd>'+
      '<dt>الكمية</dt><dd><span class="bigqty v-q"></span><div class="wh v-w"></div></dd>'+
      '<dt>اسم الريشيو</dt><dd class="v-rn"></dd>'+
      '<dt>الموديل</dt><dd class="v-m"></dd>'+
      '<dt class="k-k">الخامة</dt><dd class="v-k"></dd>'+
      '<dt class="k-p">الصفحة</dt><dd class="v-p n"></dd></dl>'+
      '<div class="addrow"><label for="addq">الكمية المطلوبة</label>'+
      '<input id="addq" type="text" inputmode="decimal" autocomplete="off" placeholder="0">'+
      '<button class="btn primary" data-a="add" type="button">أضف للسلة</button></div>'+
      '<div class="addrow-note incart" hidden></div>'+
      '<div class="btnrow">'+
      '<button class="btn wa" data-a="wa" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>واتساب</button>'+
      '<button class="btn primary" data-a="copy" type="button">نسخ الكود</button>'+
      '<button class="btn" data-a="prev" type="button">السابق</button>'+
      '<button class="btn" data-a="next" type="button">التالي</button></div></div></div>';
    document.body.appendChild(lb);

    lb.addEventListener('click', function(e){
      if(e.target === lb){ close(); return; }                 // الضغط على الخلفية
      var el = e.target.closest ? e.target.closest('[data-a]') : null;
      if(!el) return;
      var a = el.getAttribute('data-a');
      if(a==='close') close();
      else if(a==='prev') step(-1);
      else if(a==='next') step(1);
      else if(a==='copy') copy(el);
      else if(a==='wa') shareWa(el);
      else if(a==='add') addFromLb();
      else if(a==='gprev') gstep(-1);
      else if(a==='gnext') gstep(1);
    });
  }

  /* ---------- إرسال الصنف واتساب: الصورة + بيانات الصنف (من غير الكمية) ---------- */
  function waText(it){
    var lines=['كود: '+it.c,'الريشيو: '+it.r,'الموديل: '+it.m];
    if(it.k) lines.push('الخامة: '+it.k);
    return lines.join('\n');
  }
  function toJpeg(src){
    return new Promise(function(res,rej){
      var im=new Image(); im.crossOrigin='anonymous';
      im.onload=function(){
        var c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
        var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0);
        c.toBlob(function(b){ b?res(b):rej(); },'image/jpeg',0.9);
      };
      im.onerror=rej; im.src=src;
    });
  }
  function shareWa(btn){
    var it=shown[idx]; if(!it) return;
    var text=waText(it), src=pics(it)[gi];
    if(!src){ window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank'); return; }
    var fallback=function(){
      var url=new URL(src, location.href).href;
      window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank');
    };
    if(!(navigator.share && navigator.canShare)){ fallback(); return; }
    var old=btn.lastChild.textContent; btn.lastChild.textContent='جاري التجهيز…'; btn.disabled=true;
    toJpeg(src).then(function(blob){
      var f=new File([blob], it.c+'.jpg', {type:'image/jpeg'});
      if(!navigator.canShare({files:[f]})) throw 0;
      return navigator.share({files:[f], text:text});
    }).catch(function(e){ if(!e || e.name!=='AbortError') fallback(); })
      .then(function(){ btn.lastChild.textContent=old; btn.disabled=false; });
  }

  function copy(btn){
    var it=shown[idx]; if(!it) return;
    var done=function(){ btn.textContent='تم النسخ ✓'; setTimeout(function(){btn.textContent='نسخ الكود';},1400); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(it.c).then(done, selectCode);
      else selectCode();
    }catch(e){ selectCode(); }
  }
  function selectCode(){
    var el=lb.querySelector('.lb-code'); var r=document.createRange(); r.selectNodeContents(el);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  function fill(){
    var it=shown[idx]; if(!it) return;
    gi=0; showPic();
    lb.querySelector('.lb-code').textContent=it.c;
    lb.querySelector('.bigbadge').textContent=it.r;
    lb.querySelector('.v-q').innerHTML = (it.q==null ? '—' : it.q) + (isLow(it) ? '<span class="lowtag">كمية قليلة</span>' : '');
    var wEl=lb.querySelector('.v-w'); wEl.textContent='';
    if(it.w){ Object.keys(it.w).forEach(function(k){
      var sp=document.createElement('span'); sp.textContent=k; var b=document.createElement('b'); b.textContent=it.w[k];
      sp.appendChild(b); wEl.appendChild(sp); }); }
    wEl.hidden=!it.w;
    lb.querySelector('.v-rn').textContent=it.rn;
    lb.querySelector('.v-m').textContent=it.m;
    lb.querySelector('.v-k').textContent=it.k;
    lb.querySelector('.v-k').hidden = lb.querySelector('.k-k').hidden = !it.k;
    lb.querySelector('.v-p').textContent=it.p;
    lb.querySelector('.v-p').hidden = lb.querySelector('.k-p').hidden = (it.p==null);
    var inC=cart[it.c];
    lb.querySelector('#addq').value = inC ? inC : '';
    lb.querySelector('[data-a="add"]').textContent = inC ? 'تحديث السلة' : 'أضف للسلة';
    var note=lb.querySelector('.addrow-note'); note.hidden=!inC; note.textContent = inC ? ('في السلة: '+inC) : '';
    lb.querySelector('[data-a="prev"]').disabled = idx<=0;
    lb.querySelector('[data-a="next"]').disabled = idx>=shown.length-1;
  }

  document.addEventListener('keydown',function(e){
    if(cartEl && !cartEl.hidden){ if(e.key==='Escape'){ e.preventDefault(); closeCart(); } return; }
    if(!lb||lb.hidden) return;
    if(e.key==='Escape'){ e.preventDefault(); close(); }
    else if(e.key==='ArrowRight') step(-1);
    else if(e.key==='ArrowLeft') step(1);
  });
  window.addEventListener('popstate', close);

  q.addEventListener('input',render);
  clearBtn.addEventListener('click',function(){ q.value=''; q.focus(); render(); });

  /* ================= سلة المندوب ================= */
  var BYCODE={}; ITEMS.forEach(function(it){ if(!BYCODE[it.c]) BYCODE[it.c]=it; });
  var KEY='ikaf-cart-v1', NAMEKEY='ikaf-rep-name';
  var cart={};
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  try{ cart=JSON.parse(load(KEY)||'{}')||{}; }catch(e){ cart={}; }
  Object.keys(cart).forEach(function(c){ if(!BYCODE[c] || !(cart[c]>0)) delete cart[c]; });
  function persist(){ save(KEY, JSON.stringify(cart)); updateFab(); }

  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
    setTimeout(function(){ t.remove(); },1800);
  }
  function num(v){ v=String(v||'').replace(/[٠-٩۰-۹]/g,function(d){return AR[d];}).replace(',', '.'); var n=parseFloat(v); return isFinite(n)&&n>0 ? Math.round(n*100)/100 : 0; }

  function addFromLb(){
    var it=shown[idx]; if(!it) return;
    var n=num(lb.querySelector('#addq').value);
    if(!n){ if(cart[it.c]){ delete cart[it.c]; persist(); fill(); toast('اتشال من السلة'); } else toast('اكتب الكمية الأول'); return; }
    var was=!!cart[it.c]; cart[it.c]=n; persist(); fill();
    toast(was ? 'اتحدثت الكمية في السلة' : 'اتضاف للسلة');
  }

  var fab=document.createElement('button'); fab.type='button'; fab.className='cartfab';
  fab.innerHTML='🛒 السلة <span class="cnt">0</span>'; fab.addEventListener('click',openCart);
  document.body.appendChild(fab);
  function updateFab(){ var n=Object.keys(cart).length; fab.querySelector('.cnt').textContent=n; fab.hidden=n===0; }

  var cartEl=null;
  function buildCart(){
    cartEl=document.createElement('div'); cartEl.className='cart'; cartEl.hidden=true;
    cartEl.innerHTML='<div class="cart-box" role="dialog" aria-modal="true" aria-label="سلة المندوب">'+
      '<div class="cart-head"><div><h2>سلة الطلب</h2><div class="tot"></div></div>'+
      '<button class="x" type="button" data-c="close" aria-label="إغلاق">×</button></div>'+
      '<div class="cart-list"></div>'+
      '<div class="cart-foot">'+
      '<input class="rep" type="text" placeholder="اسم المندوب" autocomplete="name">'+
      '<textarea class="notes" placeholder="ملاحظات للمشرف (اختياري)"></textarea>'+
      '<div class="row"><button class="btn wa" data-c="share" type="button">إرسال ملف الطلب واتساب</button>'+
      '<button class="btn" data-c="text" type="button">إرسال كرسالة بس</button>'+
      '<button class="btn" data-c="clear" type="button">تفريغ السلة</button></div></div></div>';
    document.body.appendChild(cartEl);
    var rep=cartEl.querySelector('.rep'); rep.value=load(NAMEKEY)||'';
    rep.addEventListener('input',function(){ save(NAMEKEY, rep.value.trim()); });
    cartEl.addEventListener('click',function(e){
      if(e.target===cartEl){ closeCart(); return; }
      var el=e.target.closest?e.target.closest('[data-c]'):null; if(!el) return;
      var a=el.getAttribute('data-c');
      if(a==='close') closeCart();
      else if(a==='clear'){ if(confirm('تفريغ السلة كلها؟')){ cart={}; persist(); drawCart(); } }
      else if(a==='share') shareCart(el);
      else if(a==='text') shareText();
      else if(a==='rm'){ delete cart[el.getAttribute('data-code')]; persist(); drawCart(); }
    });
    cartEl.addEventListener('change',function(e){
      var t=e.target; if(!t.getAttribute||!t.getAttribute('data-code')) return;
      var n=num(t.value), c=t.getAttribute('data-code');
      if(n) cart[c]=n; else delete cart[c];
      persist(); drawCart();
    });
  }
  function drawCart(){
    var list=cartEl.querySelector('.cart-list'), codes=Object.keys(cart);
    var total=codes.reduce(function(a,c){ return a+cart[c]; },0);
    cartEl.querySelector('.tot').textContent = codes.length+' صنف — إجمالي الكمية '+(Math.round(total*100)/100);
    list.textContent='';
    if(!codes.length){ list.innerHTML='<div class="cart-empty">السلة فاضية. افتح أي صنف واكتب الكمية واضغط "أضف للسلة".</div>'; }
    codes.forEach(function(c){
      var it=BYCODE[c], over = it.q!=null && cart[c]>it.q;
      var row=document.createElement('div'); row.className='ci';
      row.innerHTML=(isPending(it)?'<img alt="" src="logo.png" style="object-fit:contain;background:#1A2150;padding:6px">':'<img alt="" src="'+thumbSrc(it)+'">')+
        '<div><div class="c">'+c+'</div><div class="d">'+it.r+' · '+it.m+(it.k?' · '+it.k:'')+'</div>'+
        '<div class="d'+(over?' warn':'')+'">المتاح '+(it.q==null?'—':it.q)+(over?' — المطلوب أكتر من المتاح':'')+'</div></div>'+
        '<div class="ctl"><input type="text" inputmode="decimal" autocomplete="off" data-code="'+c+'" value="'+cart[c]+'" aria-label="الكمية">'+
        '<button class="rm" type="button" data-c="rm" data-code="'+c+'">حذف</button></div>';
      list.appendChild(row);
    });
    cartEl.querySelector('[data-c="share"]').disabled = !codes.length;
    cartEl.querySelector('[data-c="text"]').disabled = !codes.length;
  }
  function openCart(){ if(!cartEl) buildCart(); drawCart(); cartEl.hidden=false; document.body.style.overflow='hidden'; }
  function closeCart(){ if(!cartEl) return; cartEl.hidden=true; if(!lb||lb.hidden) document.body.style.overflow=''; }

  function stamp(){ var d=new Date(); return d.getDate()+'-'+(d.getMonth()+1)+'-'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function rows(){
    return Object.keys(cart).map(function(c,i){ var it=BYCODE[c];
      return {n:i+1, c:c, r:it.r, m:it.m, k:it.k||'', q:cart[c], a:it.q}; });
  }
  function loadXlsx(){
    if(window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function(res,rej){ var sc=document.createElement('script'); sc.src='vendor/xlsx.mini.min.js';
      sc.onload=function(){ window.XLSX?res(window.XLSX):rej(); }; sc.onerror=rej; document.head.appendChild(sc); });
  }
  function buildFile(rep, notes){
    var R=rows(), when=stamp(), d=new Date();
    // اسم الملف إنجليزي بس: واتساب على الآيفون بيفشل يبعت ملف اسمه عربي
    var base='IKAF-order-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    var aoa=[['طلب مندوب — شركة اكاف العربية'],['المندوب',rep||''],['التاريخ',when]];
    if(notes) aoa.push(['ملاحظات',notes]);
    aoa.push([]); aoa.push(['م','الكود','الريشيو','الموديل','الخامة','الكمية المطلوبة','المتاح وقت الطلب']);
    R.forEach(function(r){ aoa.push([r.n, r.c, r.r, r.m, r.k, r.q, r.a]); });
    aoa.push(['','الإجمالي','','','',R.reduce(function(a,r){return a+r.q;},0),'']);
    return loadXlsx().then(function(X){
      var ws=X.utils.aoa_to_sheet(aoa);
      // الكود كنص عشان الأرقام الطويلة ماتتغيرش
      R.forEach(function(r,i){ var ref=X.utils.encode_cell({r:aoa.length-R.length-1+i, c:1}); ws[ref]={t:'s', v:r.c}; });
      ws['!cols']=[{wch:5},{wch:18},{wch:10},{wch:24},{wch:16},{wch:14},{wch:16}];
      var wb=X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'الطلب');
      var out=X.write(wb,{bookType:'xlsx',type:'array'});
      return new File([out], base+'.xlsx', {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    }).catch(function(){
      // احتياطي: CSV بيفتح في الإكسيل
      var csv='\ufeff'+aoa.map(function(r){ return r.map(function(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }).join('\r\n');
      return new File([csv], base+'.csv', {type:'text/csv'});
    });
  }
  function summary(rep){
    var R=rows(), lines=['طلب '+(rep||'مندوب')+' — '+stamp(), R.length+' صنف:'];
    R.forEach(function(r){ lines.push(r.c+' ('+r.r+') = '+r.q); });
    return lines.join('\n');
  }
  function shareCart(btn){
    var rep=cartEl.querySelector('.rep').value.trim(), notes=cartEl.querySelector('.notes').value.trim();
    if(!rep){ toast('اكتب اسمك الأول'); cartEl.querySelector('.rep').focus(); return; }
    var text=summary(rep)+(notes?'\nملاحظات: '+notes:'');
    // الملخص بيتنسخ عشان المندوب يلزقه مع الملف لو حب (إرسال ملف + نص مع بعض بيفشل على واتساب الآيفون)
    try{ navigator.clipboard && navigator.clipboard.writeText(text); }catch(e){}
    var old=btn.textContent; btn.textContent='جاري تجهيز الملف…'; btn.disabled=true;
    buildFile(rep, notes).then(function(f){
      if(navigator.share && navigator.canShare && navigator.canShare({files:[f]})){
        return navigator.share({files:[f]}).then(function(){ afterShare(); }, function(e){ if(e && e.name!=='AbortError') throw e; });
      }
      // الجهاز مش بيدعم مشاركة الملفات: نزّل الملف وافتح واتساب بالملخص
      var a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
      window.open('https://wa.me/?text='+encodeURIComponent(text+'\n(الملف اتنزّل على الجهاز — ابعته في نفس المحادثة)'),'_blank');
    }).catch(function(){ toast('حصلت مشكلة في تجهيز الملف'); })
      .then(function(){ btn.textContent=old; btn.disabled=false; });
  }
  function shareText(){
    var rep=cartEl.querySelector('.rep').value.trim(), notes=cartEl.querySelector('.notes').value.trim();
    if(!rep){ toast('اكتب اسمك الأول'); cartEl.querySelector('.rep').focus(); return; }
    var text=summary(rep)+(notes?'\nملاحظات: '+notes:'');
    window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  }
  function afterShare(){
    if(confirm('الطلب اتبعت؟ تفرّغ السلة؟')){ cart={}; persist(); drawCart(); closeCart(); }
  }

  updateFab();
  buildChips(); render();
})();
</script>
</body>
