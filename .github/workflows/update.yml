# تحديث المخزون تلقائي + نشر الموقع
# - لو اترفع ملف إكسيل في فولدر stock/ : الكميات بتتحدث منه، والملف بيتشال، والموقع بيتنشر
# - أي تعديل تاني على main : الموقع بيتنشر زي ما هو
# محتاج مرة واحدة: Settings → Pages → Source = GitHub Actions
name: update-stock
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Update stock from uploaded report
        run: |
          shopt -s nullglob nocaseglob
          files=(stock/*.xlsx stock/*.xls)
          if [ ${#files[@]} -eq 0 ]; then echo "مفيش تقرير مخزون جديد"; exit 0; fi
          newest=""; best=0
          for f in "${files[@]}"; do
            t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
            if [ "$t" -ge "$best" ]; then best=$t; newest="$f"; fi
          done
          echo "التقرير: $newest"
          pip install --quiet pillow numpy scipy openpyxl pypdf reportlab
          python3 build/merge_photos.py build/photos_src "$newest" build/tree.xlsx --new-stock
          git rm -q -- "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "تحديث المخزون تلقائي من $(basename "$newest")"
          git push
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html full thumb photos logo.png vendor robots.txt _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
