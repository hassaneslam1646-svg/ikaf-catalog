# تحديث المخزون تلقائي + نشر الموقع
# - لو اترفع ملف إكسيل في فولدر stock/ : الكميات بتتحدث منه، والملف بيتشال، والموقع بيتنشر
# - لو اترفعت صور في build/photos_src (باسم الكود) : الموقع بيتبني تاني بآخر مخزون (build/stock_latest.xlsx)
# - أي تعديل تاني على main : الموقع بيتنشر زي ما هو
# محتاج مرة واحدة: Settings → Pages → Source = GitHub Actions
name: update-stock
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Rebuild (new stock report or new photos)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          shopt -s nullglob nocaseglob
          files=(stock/*.xlsx stock/*.xls)
          changed=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD -- build/photos_src build/new_products.json build/overrides.json build/excluded.json build/drop_photos.json build/template.html)
          fi
          if [ ${#files[@]} -eq 0 ] && [ -z "$changed" ]; then echo "مفيش تقرير مخزون ولا صور جديدة"; exit 0; fi
          pip install --quiet pillow numpy scipy openpyxl pypdf reportlab
          if [ ${#files[@]} -gt 0 ]; then
            newest=""; best=0
            for f in "${files[@]}"; do
              t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
              if [ "$t" -ge "$best" ]; then best=$t; newest="$f"; fi
            done
            echo "تقرير مخزون جديد: $newest"
            python3 build/merge_photos.py build/photos_src "$newest" build/tree.xlsx --new-stock
            git rm -q -- "${files[@]}"
            msg="تحديث المخزون تلقائي من $(basename "$newest")"
          else
            echo "اتغير: $changed"
            python3 build/merge_photos.py build/photos_src build/stock_latest.xlsx build/tree.xlsx
            msg="تحديث الصور تلقائي"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "مفيش تغيير"; exit 0; fi
          git commit -q -m "$msg"
          git push
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html full thumb photos logo.png vendor robots.txt _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
